[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muscles-mcp"
version = "1.0.0"
description = "MCP adapter for Muscles application contract"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["muscles @ git+https://github.com/butkoden/muscles.git"]

[tool.pytest.ini_options]
testpaths = ["tests"]
